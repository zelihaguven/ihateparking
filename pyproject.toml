[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ihateparking"
version = "0.1.0"
description = "A closed-loop autonomous parking research prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.scripts]
ihateparking = "ihateparking.run:main"
ihateparking-dashboard = "ihateparking.dashboard:main"
ihateparking-pedestrian-stress = "ihateparking.pedestrian_stress_test:main"

[project.optional-dependencies]
vision = [
  "opencv-python-headless>=4.9",
]
dashboard = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
include = ["ihateparking*"]
